[project]
name = "paper-collections"
version = "0.1.0"
description = "A local web app for reading and organizing conference papers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=7.4,<9",
]
notebooks = [
    "jupyterlab>=4,<5",
    "matplotlib>=3.9,<4",
    "networkx>=3.3,<4",
    "pandas>=2.2,<3",
    "seaborn>=0.13,<1",
    "wordcloud>=1.9,<2",
]

[tool.uv]
package = false
